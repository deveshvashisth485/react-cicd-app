name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Test EC2 Connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "echo Connected Successfully"

      - name: Transfer Files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key \
          -r ./* \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/react-cicd-app

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "cd /home/ubuntu/react-cicd-app && npm install"
